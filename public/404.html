<!doctype html>
<html lang="de">
<head>

    body{font-family:system-ui,-apple-system,sans-serif;background:#f8f5f0;color:#1e1e1e;display:grid;place-items:center;min-height:100dvh;margin:0;padding:1rem}

    a{display:inline-block;padding:.65rem 1.25rem;background:#1a3a5c;color:#fff;text-decoration:none;border-radius:10px;font-weight:600}
    a:hover{background:#15304d}

</head>
<body>
  <div class="box">
    <h1>Seite nicht gefunden</h1>
